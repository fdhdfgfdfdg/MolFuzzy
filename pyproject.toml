[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molfuzzy"
version = "2.0.10"
description = "Validated fuzzy preference scoring, consensus diagnostics and angular traversal analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ruobing Wang", email = "ruobing2@alumni.cmu.edu"}, {name = "Xingzhi Wang", email = "xingzhi2@alumni.cmu.edu"}]
maintainers = [{name = "Ruobing Wang", email = "ruobing2@alumni.cmu.edu"}]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/fdhdfgfdfdg/MolFuzzy"
Issues = "https://github.com/fdhdfgfdfdg/MolFuzzy/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "PyYAML>=6"]
plot = ["matplotlib>=3.7"]
interop = ["pymcdm>=1.2"]

[project.scripts]
molfuzzy = "molfuzzy.cli:main"

[tool.setuptools]
packages = ["molfuzzy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
