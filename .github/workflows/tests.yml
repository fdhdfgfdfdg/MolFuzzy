name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.12']
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-22.04
            python: '3.9'
            numpy: '1.24.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest "PyYAML>=6"
      - run: python -m build --outdir distributions
      - if: matrix.numpy != ''
        run: python -m pip install numpy==${{ matrix.numpy }}
      - name: Verify release artifacts
        run: python docs/verify_release.py
      - name: Install wheel
        shell: bash
        run: python -m pip install distributions/*.whl
      - run: python docs/run_ci_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-validation-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-evidence/
          if-no-files-found: warn
